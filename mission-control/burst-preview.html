let currentIndex = 0;
let mode = 'both';

function setMode(m) {
  mode = m;
  ['both','stoic','bible'].forEach(x => document.getElementById('btn-'+x).classList.remove('active'));
  document.getElementById('btn-'+m).classList.add('active');
  renderCurrent();
}

function nextBurst() {
  currentIndex = (currentIndex + 1) % library.length;
  renderCurrent();
}

function randomBurst() {
  currentIndex = Math.floor(Math.random() * library.length);
  renderCurrent();
}

function renderCurrent() {
  const e = library[currentIndex];
  const now = new Date();
  const t = now.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', hour12:true});

  document.getElementById('burst-num').textContent = `★  CANON BURST #${String(currentIndex+1).padStart(2,'0')}`;
  document.getElementById('burst-theme').textContent = `THEME: ${e.theme}`;
  document.getElementById('burst-time').textContent = t;

  const stoicSec = document.getElementById('stoic-section');
  const bibleSec = document.getElementById('bible-section');
  const divider  = document.getElementById('divider');

  if (mode === 'both' || mode === 'stoic') {
    stoicSec.style.display = 'block';
    document.getElementById('stoic-quote').textContent = `"${e.stoic.quote}"`;
    document.getElementById('stoic-author').textContent = `— ${e.stoic.author}`;
  } else {
    stoicSec.style.display = 'none';
  }

  divider.style.display = (mode === 'both') ? 'block' : 'none';

  if (mode === 'both' || mode === 'bible') {
    bibleSec.style.display = 'block';
    document.getElementById('bible-verse').textContent = `"${e.bible.verse}"`;
    document.getElementById('bible-ref').textContent = `— ${e.bible.ref}`;
  } else {
    bibleSec.style.display = 'none';
  }

  document.getElementById('counter').textContent =
    `Canon ${currentIndex+1} of 81  ·  ${library.filter((x,i)=>i<=currentIndex&&x.theme===e.theme).length} of 9 in ${e.theme}`;
}

renderCurrent();
